version: "1.0"
namespace: app

# SQLite harness for the typed CRM lifecycle and public composition contracts.

entries:
  - name: crm_callable_owner_test
    kind: function.lua
    meta: { type: test, suite: kickside_crm }
    source: file://crm_callable_owner_test.lua
    method: run
    modules: [registry]
    imports:
      test: wippy.test:test

  - name: crm_schema_error_test
    kind: function.lua
    meta: { type: test, suite: kickside_crm }
    source: file://crm_schema_error_test.lua
    method: run
    modules: [sql, uuid]
    imports:
      test: wippy.test:test
      storage: kickside.crm.persist:repo
      types: kickside.crm:types

  - name: module_access_policy_test
    kind: function.lua
    meta: { type: test, suite: module_access_policy }
    source: file://module_access_policy_test.lua
    method: run
    modules: [registry, security]
    imports:
      test: wippy.test:test

  - name: wait_for_boot
    kind: function.lua
    meta:
      type: test
      suite: "00_setup"
      comment: Applies the isolated SQLite harness schema before suites run.
    source: file://wait_for_boot.lua
    method: run
    modules: [json, sql]
    imports:
      runner: wippy.migration:runner
      write_counter: app:write_counter

  - name: write_counter
    kind: library.lua
    meta:
      type: test_helper
      comment: Per-CRM row-write counter on the sink receipt table, installed at harness setup.
    source: file://write_counter.lua
    modules: [sql]

  - name: db
    kind: db.sql.sqlite
    foreign_keys: true
    meta:
      comment: In-memory database for CRM tests.
    file: ":memory:"

  - name: env_storage
    kind: env.storage.file
    meta:
      type: envstorage
    file_path: ./.wippy/test.env
    auto_create: true

  - name: processes
    kind: process.host
    lifecycle:
      auto_start: true

  - name: gateway
    kind: http.service
    meta:
      comment: Test HTTP server.
    addr: :19131
    lifecycle:
      auto_start: false

  - name: api
    kind: http.router
    meta:
      comment: Test API router.
      server: gateway
    prefix: /api

  - name: user
    kind: security.policy
    meta:
      comment: Permissive scope for CRM tests. The group is qualified because a policy's bare group name is registered under the policy's own namespace, so security.named_scope -- which parses its argument as a registry id -- only recovers this policy when a frozen CRM identity names the group the same way.
    groups:
      - app.security:crm_test
    policy:
      resources: '*'
      actions: '*'
      effect: allow

  - name: admin.all_access
    kind: security.policy
    meta:
      comment: Root administrator wildcard scope for CRM endpoint-access tests.
    groups:
      - app.security:admin
    policy:
      resources: '*'
      actions: '*'
      effect: allow

  # The application's authenticated-user surface, modelled. The wildcard policy
  # above proves nothing about a person: it grants permissions no deployed user
  # holds, so a read path that only works because the caller could do anything
  # passes the suite and fails on a host.
  - name: plain_user.registry
    kind: security.policy
    meta:
      comment: Registry discovery a host grants a user -- engine namespaces only, nothing under a product one.
    groups:
      - app.security:user
    policy:
      resources: [ 'kickside.component*', 'kickside.core*', 'kickside.contract*', 'kickside.data*', 'kickside.users*', 'kickside.settings*', 'kickside.execution*', 'kickside.inbox*', 'kickside.blocks*', 'kickside.widgets*', 'wippy.*' ]
      actions: [ registry.get, registry.find ]
      effect: allow

  - name: plain_user.data
    kind: security.policy
    meta:
      comment: Runtime data primitives behind user-scoped endpoints.
    groups:
      - app.security:user
    policy:
      resources: [ 'app:db' ]
      actions: [ db.get ]
      effect: allow

  - name: no_crm_access
    kind: security.policy
    meta:
      comment: Nonmatching allow policy for CRM endpoint fail-closed tests.
    groups:
      - crm_test_no_access
    policy:
      resources: app.unrelated:*
      actions: access
      effect: allow

  # kickside/users supplies the default kickside.contract:scope_resolver binding
  # now that it is wired in below; a harness-local stub would collide on the
  # single allowed default binding per contract.

  - name: dep.kickside.users
    kind: ns.dependency
    version: "*"
    meta:
      comment: Users -- owns app_users, the table wippy/session's migrations declare a foreign key against. Postgres refuses that DDL when the table is absent, which halts the whole migration set. Users also supplies the canonical kickside.contract:scope_resolver binding a frozen CRM identity is recovered through.
    component: kickside/users
    parameters:
      - { name: kickside.users:target_db, value: app:db }
      - { name: kickside.users:env_storage, value: app:env_storage }
      - { name: kickside.users:api_router, value: app:api }
      - { name: kickside.users:public_router, value: app:api }
      - { name: kickside.users:ui_server, value: app:gateway }
      # The two scopes are group ids, not policy entry ids: the resolver derives
      # a subject's scope name from its groups and falls back to the default
      # group, and named_scope has to find a policy group under whichever it
      # returns.
      - { name: kickside.users:user_security_scope, value: app.security:crm_test }
      - { name: kickside.users:admin_security_scope, value: app.security:admin }
      - { name: kickside.users:login_role_resource, value: app.security:* }

  - name: dep.kickside.settings
    kind: ns.dependency
    version: "*"
    meta:
      comment: Settings -- users reads and writes application settings through it, and it names no host of its own, so the harness supplies the three it requires.
    component: kickside/settings
    parameters:
      - { name: kickside.settings:target_db, value: app:db }
      - { name: kickside.settings:api_router, value: app:api }
      - { name: kickside.settings:ui_server, value: app:gateway }

  # The standalone harness is the deployment root, so it supplies the host
  # bindings required by CRM's dependency closure explicitly.
  - name: dep.kickside.crm
    kind: ns.dependency
    version: "*"
    component: kickside/crm
    parameters:
      - { name: kickside.crm:api_router, value: app:api }
      - { name: kickside.crm:ui_server, value: app:gateway }
      - { name: kickside.crm:target_db, value: app:db }
      - { name: kickside.crm:process_host, value: app:processes }
      - { name: kickside.crm.security:user_security_scope, value: app:user }
      - { name: kickside.crm.security:admin_security_scope, value: app:user }
      - { name: wippy.session:api_router, value: app:api }
      - { name: wippy.session:env_storage, value: app:env_storage }
      - { name: wippy.session:delegation_func_id, value: userspace.dataflow.session:delegate }
      - { name: wippy.views:api_router, value: app:api }
      - { name: wippy.views:env_storage, value: app:env_storage }
      - { name: wippy.bootloader:application_host, value: app:processes }
      - { name: wippy.bootloader:env_storage, value: app:env_storage }

  - name: dep.kickside.component
    kind: ns.dependency
    version: '*'
    component: kickside/component
    parameters:
    - name: kickside.component:target_db
      value: app:db
    - name: kickside.component:api_router
      value: app:api
    - name: kickside.component:lifecycle_impl
      value: kickside.core.lifecycle:component_lifecycle_impl

  - name: dep.kickside.jobs
    kind: ns.dependency
    version: '*'
    component: kickside/jobs
    parameters:
    - name: kickside.core.jobs:target_db
      value: app:db
    - name: kickside.core.jobs:process_host
      value: app:processes

  - name: dep.kickside.core
    kind: ns.dependency
    version: '*'
    component: kickside/core
    parameters:
    - name: kickside.core:target_db
      value: app:db
    - name: kickside.core.lifecycle:process_host
      value: app:processes
    - name: kickside.core.lifecycle:user_lifecycle_grant
      value:
        subject_id: app:user
        subject_type: group
        access_mask: 2
    - name: kickside.core.lifecycle:admin_lifecycle_grant
      value:
        subject_id: app:user
        subject_type: group
        access_mask: 3
    - name: kickside.core.retention:process_host
      value: app:processes
    - name: kickside.core.threads:process_host
      value: app:processes
    - name: kickside.core.projections:process_host
      value: app:processes
    - name: kickside.core.retention:api_router
      value: app:api
    - name: kickside.core.threads:api_router
      value: app:api
    - name: kickside.core.projections:api_router
      value: app:api
    - name: kickside.core.retention:env_storage
      value: app:env_storage
    - name: kickside.core.projections:env_storage
      value: app:env_storage
    - name: kickside.core.retention:user_security_scope
      value: app:user
    - name: kickside.core.threads:user_security_scope
      value: app:user

  - name: dep.kickside.inbox
    kind: ns.dependency
    version: '*'
    component: kickside/inbox
    parameters:
    - name: kickside.inbox:api_router
      value: app:api
    - name: kickside.inbox:ui_server
      value: app:gateway

  - name: dep.kickside.blocks
    kind: ns.dependency
    version: "*"
    component: kickside/blocks
    parameters:
      - { name: kickside.blocks:process_host, value: app:processes }

  - name: dep.kickside.widgets
    kind: ns.dependency
    version: "*"
    component: kickside/widgets
    parameters:
      - { name: kickside.widgets:api_router, value: app:api }
      - { name: kickside.widgets:ui_server, value: app:gateway }

  - name: dep.wippy.migration
    kind: ns.dependency
    version: "*"
    meta: { comment: Binds CRM migrations to the in-memory test database. }
    component: "wippy/migration"
    parameters:
