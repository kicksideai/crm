name: Release
'on':
  push:
    branches:
    - main
  workflow_dispatch: {}
permissions: {}
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release-please:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      issues: write
      pull-requests: write
      actions: write
    steps:
    - id: release
      uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7
      with:
        token: ${{ github.token }}
        config-file: release-please-config.json
        manifest-file: .release-please-manifest.json
    # Events from GITHUB_TOKEN do not start workflows, so start CI on the release PR branch.
    - name: Run CI on the release PR
      if: ${{ steps.release.outputs.prs_created == 'true' }}
      env:
        GH_TOKEN: ${{ github.token }}
        RELEASE_PRS: ${{ steps.release.outputs.prs }}
      run: |
        set -euo pipefail
        jq -r '.[].headBranchName' <<<"${RELEASE_PRS:-[]}" | while read -r branch; do
          gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref "$branch"
        done
