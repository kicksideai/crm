version: "1.0"
namespace: kickside.crm.traits

# Object-neutral agent surface. Each registry tool is one exact CRM operation;
# schema changes use the portable authority, with no action dispatcher, direct
# merge, or visual-builder coupling.
entries:
  - name: crm_tool
    kind: library.lua
    meta: { comment: Shared exact-operation CRM agent tool implementation. }
    source: file://crm_tool.lua
    modules: [ctx, security, uuid]
    imports: &crm_tool_imports
      tool_result: kickside.contract:tool_result
      reader: kickside.crm:crm
      writer: kickside.crm.command:writer
      resolver: kickside.crm.resolution:resolve_lib
      schema: kickside.crm.schema:schema
      mutation: kickside.crm.schema:mutation
      types: kickside.crm:types
      locate: kickside.crm.workspace:locate
      create_service: kickside.crm.workspace:create

  - name: crm_trait
    kind: registry.entry
    meta:
      type: agent.trait
      title: CRM
      public: true
      icon: tabler:address-book
      comment: Read and change records, collection membership, activity, and typed references in a configured CRM.
      tags: [crm, records, read, write]
      context_schema:
        type: object
        properties:
          crm_id:
            type: string
            description: CRM component/thread id used when a call does not provide crm_id.
        additionalProperties: false
    prompt: |
      A CRM holds typed records (companies, people, deals, or any object type its
      schema declares), relations between them, staged collections such as a
      sales pipeline, and an activity timeline. Each tool is one exact operation.

      Addressing: every record tool takes an optional crm_id. Omit it when the
      caller has one CRM; CRMList shows the CRMs you can read, and CRMCreate makes
      one when there is none.

      Shaping: CRMSchemaGet exports the declaration; edit it and pass it whole to
      CRMSchemaApply. A fresh CRM has an empty declaration. Removals are explicit
      (spec.remove), never by omission.

      Writing: CRMCreateRecords creates many records in one atomic batch, so an
      import is one call. A relation field takes a typed reference
      {"kind": "record", "type": "<object_type>", "id": "<record_id>"} (or an
      array for many-valued relations) directly in values, including a record
      created earlier in the same batch when you supply its record_id. Use
      CRMResolveRecord to find-or-create by an exact alias (email, domain) when a
      record may already exist. CRMSetMembership places a record on a pipeline
      stage. Record writes append typed CRM events. Merge candidates must use the
      CRM merge-review Block; agents cannot merge records directly.
    tools:
      - kickside.crm.traits:list_crms
      - kickside.crm.traits:create_crm
      - kickside.crm.traits:list_records
      - kickside.crm.traits:get_record
      - kickside.crm.traits:get_board
      - kickside.crm.traits:get_timeline
      - kickside.crm.traits:schema.get
      - kickside.crm.traits:schema.apply
      - kickside.crm.traits:resolve_record
      - kickside.crm.traits:create_record
      - kickside.crm.traits:create_records
      - kickside.crm.traits:update_record
      - kickside.crm.traits:set_membership
      - kickside.crm.traits:log_activity
      - kickside.crm.traits:delete_activity
      - kickside.crm.traits:link_reference
      - kickside.crm.traits:unlink_reference

  - name: list_crms
    kind: function.lua
    meta:
      type: tool
      title: List CRMs
      llm_alias: CRMList
      llm_description: List the CRMs you can read, oldest first, with their crm_id and title.
      mcp: { required_scopes: [state.read] }
      input_schema: |
        {
          "type": "object",
          "properties": {},
          "additionalProperties": false
        }
      output_schema: |
        {
          "type": "object",
          "properties": {
            "success": { "type": "boolean", "const": true },
            "crms": {
              "type": "array",
              "items": {
                "type": "object",
                "properties": {
                  "crm_id": { "type": "string" },
                  "title": { "type": "string" }
                },
                "required": ["crm_id", "title"],
                "additionalProperties": false
              }
            }
          },
          "required": ["success", "crms"],
          "additionalProperties": false
        }
    source: file://crm_tool.lua
    method: list_crms
    modules: [ctx, security, uuid]
    imports: *crm_tool_imports

  - name: create_crm
    kind: function.lua
    meta:
      type: tool
      title: Create CRM
      llm_alias: CRMCreate
      llm_description: "Create a CRM with an empty declaration, then shape it with CRMSchemaApply. idempotency_key is any stable string, such as the title: repeating the call with the same key returns the same CRM (replayed: true)."
      mcp: { required_scopes: [state.read, state.write] }
      input_schema: |
        {
          "type": "object",
          "properties": {
            "title": { "type": "string" },
            "idempotency_key": { "type": "string" },
            "parent_id": { "type": "string" }
          },
          "required": ["title", "idempotency_key"],
          "additionalProperties": false
        }
      output_schema: |
        {
          "oneOf": [
            {
              "type": "object",
              "properties": {
                "success": { "type": "boolean", "const": true },
                "crm_id": { "type": "string" },
                "title": { "type": "string" },
                "revision": {},
                "replayed": { "type": "boolean" }
              },
              "required": ["success", "crm_id", "title", "replayed"],
              "additionalProperties": false
            },
            {
              "type": "object",
              "properties": {
                "success": { "type": "boolean", "const": false },
                "error": { "type": "string" }
              },
              "required": ["success", "error"],
              "additionalProperties": false
            }
          ]
        }
    source: file://crm_tool.lua
    method: create_crm
    modules: [ctx, security, uuid]
    imports: *crm_tool_imports

  - name: list_records
    kind: function.lua
    meta:
      type: tool
      title: List CRM Records
      llm_alias: CRMListRecords
      llm_description: "Page and search compact record summaries (id, type, dates and name/title/status/owner values). Pass fields to select other record values; CRMGetRecord returns all values and associations. Continue with offset + limit until total is reached."
      mcp: { required_scopes: [state.read] }
      input_schema: |
        {
          "type": "object",
          "properties": {
            "crm_id": { "type": "string" },
            "object_type": { "type": "string" },
            "filters": {
              "type": "array",
              "items": {
                "type": "object",
                "properties": {
                  "attr": { "type": "string" },
                  "op": { "type": "string", "enum": ["eq", "neq", "lt", "lte", "gt", "gte", "contains", "in_list", "is_null"] },
                  "value": {}
                },
                "required": ["attr", "op"],
                "additionalProperties": false
              }
            },
            "sort": {
              "type": "object",
              "properties": {
                "attr": { "type": "string" },
                "dir": { "type": "string", "enum": ["asc", "desc"] }
              },
              "required": ["attr", "dir"],
              "additionalProperties": false
            },
            "search": { "type": "string" },
            "fields": { "type": "array", "items": { "type": "string" }, "description": "Record value names to return instead of name/title/status/owner." },
            "limit": { "type": "integer", "minimum": 1 },
            "offset": { "type": "integer", "minimum": 0 }
          },
          "required": ["object_type"],
          "additionalProperties": false
        }
      output_schema: |
        {
          "oneOf": [
            {
              "type": "object",
              "properties": {
                "success": {
                  "type": "boolean",
                  "const": true
                },
                "rows": {
                  "type": "array",
                  "items": {
                    "type": "object",
                    "properties": {
                      "record_id": {
                        "type": "string"
                      },
                      "object_type": {
                        "type": "string"
                      },
                      "values": {
                        "description": "Summary values, or the values named by fields. Full associations are available from CRMGetRecord.",
                        "type": "object"
                      }
                    },
                    "required": [
                      "record_id"
                    ]
                  }
                },
                "total": {
                  "type": "integer",
                  "minimum": 0
                },
                "limit": {
                  "type": "integer",
                  "minimum": 1
                },
                "offset": {
                  "type": "integer",
                  "minimum": 0
                }
              },
              "required": [
                "success",
                "rows",
                "total",
                "limit",
                "offset"
              ],
              "additionalProperties": false
            },
            {
              "type": "object",
              "properties": {
                "success": {
                  "type": "boolean",
                  "const": false
                },
                "error": {
                  "type": "string"
                }
              },
              "required": [
                "success",
                "error"
              ],
              "additionalProperties": false
            }
          ]
        }
    source: file://crm_tool.lua
    method: list_records
    modules: [ctx, security, uuid]
    imports: *crm_tool_imports

