  - name: create_records
    kind: function.lua
    meta:
      type: tool
      title: Create CRM Records
      llm_alias: CRMCreateRecords
      llm_description: "Create many records in one atomic batch: all land or none do. Each item is {object_type, values, record_id?}. A relation value may reference a record created earlier in the same batch when that record's record_id is given. Returns record_ids in input order."
      mcp: { required_scopes: [state.read, state.write] }
      input_schema: |
        {
          "type": "object",
          "properties": {
            "crm_id": { "type": "string" },
            "records": {
              "type": "array",
              "minItems": 1,
              "items": {
                "type": "object",
                "properties": {
                  "object_type": { "type": "string" },
                  "record_id": { "type": "string" },
                  "values": { "type": "object" }
                },
                "required": ["object_type", "values"],
                "additionalProperties": false
              }
            }
          },
          "required": ["records"],
          "additionalProperties": false
        }
      output_schema: |
        {
