                  "type": "object",
                  "properties": {
                    "record_id": {
                      "type": "string"
                    },
                    "object_type": {
                      "type": "string"
                    },
                    "values": {
                      "type": "object"
                    }
                  },
                  "required": [
                    "record_id"
                  ]
                }
              },
              "required": [
                "success",
                "record"
              ],
              "additionalProperties": false
            },
            {
              "type": "object",
              "properties": {
                "success": {
                  "type": "boolean",
                  "const": false
                },
                "error": {
                  "type": "string"
                }
              },
              "required": [
                "success",
                "error"
              ],
              "additionalProperties": false
            }
          ]
        }
    source: file://crm_tool.lua
    method: get_record
    modules: [ctx, security, uuid]
    imports: *crm_tool_imports

  - name: get_board
