          "oneOf": [
            {
              "type": "object",
              "properties": {
                "success": {
                  "type": "boolean",
                  "const": true
                },
                "board": {
                  "type": "object",
                  "description": "Stage id to lane.",
                  "additionalProperties": {
                    "type": "object",
                    "properties": {
                      "records": {
                        "type": "array",
                        "items": {
                          "type": "object"
                        }
                      },
                      "total": {
                        "type": "integer",
                        "minimum": 0
                      }
                    },
                    "required": [
                      "records",
                      "total"
                    ]
                  }
                }
              },
              "required": [
