                },
                "record": {
                  "type": "object",
                  "properties": {
                    "record_id": {
                      "type": "string"
                    },
                    "object_type": {
                      "type": "string"
                    },
                    "values": {
                      "type": "object"
                    }
                  },
                  "required": [
                    "record_id"
