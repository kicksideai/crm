                "board"
              ],
              "additionalProperties": false
            },
            {
              "type": "object",
              "properties": {
                "success": {
                  "type": "boolean",
                  "const": false
                },
                "error": {
                  "type": "string"
                }
              },
              "required": [
                "success",
                "error"
              ],
              "additionalProperties": false
            }
          ]
        }
    source: file://crm_tool.lua
    method: get_board
    modules: [ctx, security, uuid]
    imports: *crm_tool_imports

  - name: get_timeline
    kind: function.lua
    meta:
      type: tool
      title: Get CRM Timeline
      llm_alias: CRMGetTimeline
      llm_description: "Read compact CRM activity summaries newest first, optionally restricted to one record. Pass fields to select other activity fields such as payload. Follow next_cursor for older activity."
      mcp: { required_scopes: [state.read] }
      input_schema: |
        {
          "type": "object",
          "properties": {
            "crm_id": { "type": "string" },
            "record_id": { "type": "string" },
            "fields": { "type": "array", "items": { "type": "string" }, "description": "Activity row fields to return instead of summary fields. Identifiers remain present; request payload for complete activity content." },
            "limit": { "type": "integer", "minimum": 1, "description": "Page size, default 100, at most 500 rows per page; follow next_cursor for the rest." },
            "cursor": { "type": "string", "description": "next_cursor of the previous page." }
          },
          "additionalProperties": false
        }
      output_schema: |
        {
          "oneOf": [
            {
              "type": "object",
              "properties": {
                "success": {
                  "type": "boolean",
                  "const": true
                },
                "entries": {
                  "type": "array",
                  "items": {
                    "type": "object",
                    "properties": {
                      "activity_id": {
                        "type": "string"
                      },
                      "record_id": {
                        "type": "string"
                      },
                      "activity_type": {
                        "type": "string"
                      },
                      "occurred_at": {
                        "type": "string"
                      },
                      "title": { "type": "string", "description": "Activity title from the stored payload." },
                      "payload": {
                        "type": "object", "description": "Present when explicitly requested in fields."
                      }
                    },
                    "required": [
                      "activity_id"
                    ]
                  }
                },
                "next_cursor": {
                  "type": "string",
                  "description": "Pass as cursor for the following page; absent on the final page."
                }
              },
              "required": [
                "success",
                "entries"
              ],
              "additionalProperties": false
            },
            {
              "type": "object",
              "properties": {
                "success": {
                  "type": "boolean",
                  "const": false
                },
                "error": {
                  "type": "string"
                }
              },
              "required": [
                "success",
                "error"
              ],
              "additionalProperties": false
            }
          ]
        }
    source: file://crm_tool.lua
    method: get_timeline
    modules: [ctx, security, uuid]
    imports: *crm_tool_imports

  - name: schema.get
    kind: function.lua
    meta:
      type: tool
      title: Get CRM Schema
      llm_alias: CRMSchemaGet
      llm_description: Export the CRM declaration (object types, fields, relations, pipelines, views) as the artifact CRMSchemaApply accepts back.
      mcp: { required_scopes: [state.read] }
      input_schema: |
        {
          "type": "object",
          "properties": {
            "crm_id": { "type": "string" },
            "portable_key": { "type": "string" }
          },
          "additionalProperties": false
        }
      output_schema: |
        {
          "oneOf": [
            {
              "type": "object",
              "properties": {
                "success": {
                  "type": "boolean",
                  "const": true
                },
                "schema": {
                  "type": "object",
                  "properties": {
                    "kind": {
                      "type": "string",
                      "const": "CRMConfig"
                    },
                    "metadata": {
                      "type": "object"
                    },
                    "spec": {
                      "type": "object"
                    }
                  },
                  "required": [
                    "kind",
                    "metadata",
                    "spec"
                  ]
                }
              },
              "required": [
                "success",
                "schema"
              ],
              "additionalProperties": false
            },
            {
              "type": "object",
              "properties": {
                "success": {
                  "type": "boolean",
                  "const": false
                },
                "error": {
                  "type": "string"
                }
              },
              "required": [
                "success",
                "error"
              ],
              "additionalProperties": false
            }
          ]
        }
    source: file://crm_tool.lua
    method: get_schema
    modules: [ctx, security, uuid]
    imports: *crm_tool_imports

  - name: schema.apply
    kind: function.lua
    meta:
      type: tool
      title: Apply CRM Schema
      llm_alias: CRMSchemaApply
      llm_description: "Apply a whole CRM declaration in one transaction. Start from CRMSchemaGet and pass the edited artifact back; a fresh CRM starts empty. spec.objectTypes rows: {portableKey: \"object/<type>\", type, label, plural, icon}. spec.attributes rows: {portableKey: \"attribute/<type>/<attr>\", object_type, attr, label, data_type, sort_order, config}; data_type is text, number, boolean, date, time, datetime, select, multi_select, currency, email, phone, url or relation; config may set required, unique, alias (an exact-match key such as email or domain), options for selects, ui.role title or subtitle, and for relations target {kind: record, object_type}, cardinality one or many. spec.pipelines rows: {portableKey: \"pipeline/<id>\", collection_id, object_type, label, stages: [{stage_id, label, order, terminal, won}]}. spec.views and spec.policies are arrays, possibly empty. Pass expected_revision from the exported metadata.revision to refuse a concurrent change."
      mcp: { required_scopes: [state.read, state.write] }
      input_schema: |
        {
          "type": "object",
          "properties": {
            "crm_id": { "type": "string" },
            "artifact": {
              "type": "object",
              "properties": {
                "apiVersion": { "type": "string", "const": "kickside.crm/config.v1" },
                "kind": { "type": "string", "const": "CRMConfig" },
                "metadata": { "type": "object" },
                "spec": { "type": "object" }
              },
              "required": ["apiVersion", "kind", "metadata", "spec"],
              "additionalProperties": true
            },
            "expected_revision": { "type": "string" }
          },
          "required": ["artifact"],
          "additionalProperties": false
        }
      output_schema: |
        {
          "oneOf": [
            {
              "type": "object",
              "properties": {
                "success": {
                  "type": "boolean",
                  "const": true
                },
                "changed": {
                  "type": "boolean"
                },
                "revision": {},
                "source_hash": {
                  "type": "string"
                }
              },
              "required": [
                "success",
                "revision"
              ],
              "additionalProperties": false
            },
            {
              "type": "object",
              "properties": {
                "success": {
                  "type": "boolean",
                  "const": false
                },
                "error": {
                  "type": "string"
                }
              },
              "required": [
                "success",
                "error"
              ],
              "additionalProperties": false
            }
          ]
        }
    source: file://crm_tool.lua
    method: apply_schema
    modules: [ctx, security, uuid]
    imports: *crm_tool_imports

  - name: resolve_record
