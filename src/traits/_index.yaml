            "values": { "type": "object" }
          },
          "required": ["object_type", "values"],
          "additionalProperties": false
        }
      output_schema: |
        {
          "oneOf": [
            {
              "type": "object",
              "properties": {
                "success": {
                  "type": "boolean",
                  "const": true
                },
                "record_id": {
                  "type": "string"
                }
              },
              "required": [
                "success",
                "record_id"
              ],
              "additionalProperties": false
            },
            {
              "type": "object",
              "properties": {
                "success": {
                  "type": "boolean",
                  "const": false
                },
                "error": {
                  "type": "string"
                }
              },
              "required": [
                "success",
                "error"
              ],
              "additionalProperties": false
            }
