          "additionalProperties": false
        }
      output_schema: |
        {
          "oneOf": [
            {
              "type": "object",
              "properties": {
                "success": {
                  "type": "boolean",
                  "const": true
                },
                "record": {
                  "type": "object",
                  "properties": {
                    "record_id": {
                      "type": "string"
                    },
                    "object_type": {
                      "type": "string"
                    },
                    "values": {
                      "type": "object"
                    }
                  },
                  "required": [
                    "record_id"
                  ]
                },
                "created": {
                  "type": "boolean"
                },
                "outcomes": {
                  "type": "array"
                },
                "receipt": {
                  "type": "object"
                },
                "checkpoint": {
                  "type": "object"
                },
                "suggestions": {
                  "type": "array"
                }
              },
              "required": [
                "success",
                "record",
                "created"
              ],
              "additionalProperties": false
            },
            {
              "type": "object",
              "properties": {
                "success": {
                  "type": "boolean",
                  "const": false
                },
                "error": {
                  "type": "string"
                }
              },
              "required": [
                "success",
                "error"
              ],
              "additionalProperties": false
            }
          ]
        }
    source: file://crm_tool.lua
    method: resolve_record
    modules: [ctx, security, uuid]
    imports: *crm_tool_imports

  - name: create_record
    kind: function.lua
    meta:
      type: tool
      title: Create CRM Record
      llm_alias: CRMCreateRecord
      llm_description: "Create one record of a declared object type. values holds field values; a relation field takes a typed reference {kind: record, type: <object_type>, id: <record_id>} or an array of them. record_id is generated as <object_type>:<uuid> when omitted. For several records use CRMCreateRecords."
