version: "1.0"
namespace: kickside.crm.traits

# Object-neutral agent surface. Each registry tool is one exact CRM operation;
# schema changes use the portable authority, with no action dispatcher, direct
# merge, or visual-builder coupling.
entries:
  - name: crm_tool
    kind: library.lua
    meta: { comment: Shared exact-operation CRM agent tool implementation. }
    source: file://crm_tool.lua
    modules: [ctx, security, uuid]
    imports: &crm_tool_imports
      tool_result: kickside.contract:tool_result
      reader: kickside.crm:crm
      writer: kickside.crm.command:writer
      resolver: kickside.crm.resolution:resolve_lib
      schema: kickside.crm.schema:schema
      mutation: kickside.crm.schema:mutation

  - name: crm_trait
    kind: registry.entry
    meta:
      type: agent.trait
      title: CRM
      public: true
      icon: tabler:address-book
      comment: Read and change records, collection membership, activity, and typed references in a configured CRM.
      tags: [crm, records, read, write]
      context_schema:
        type: object
        properties:
          crm_id:
            type: string
            description: CRM component/thread id used when a call does not provide crm_id.
        additionalProperties: false
    prompt: |
      Use the exact CRM tool for the operation you need. Object types, fields,
      collections, and views are application-owned declarations. SchemaGet exports
      the canonical portable declaration and SchemaApply validates and applies
      that artifact through the schema authority. ResolveRecord performs exact-alias
      resolution through the canonical resolver. Record writes append typed CRM events. Merge candidates must
      use the CRM merge-review Block; agents cannot merge records directly.
    tools:
      - kickside.crm.traits:list_records
      - kickside.crm.traits:get_record
      - kickside.crm.traits:get_board
      - kickside.crm.traits:get_timeline
      - kickside.crm.traits:schema.get
      - kickside.crm.traits:schema.apply
      - kickside.crm.traits:resolve_record
      - kickside.crm.traits:create_record
      - kickside.crm.traits:update_record
      - kickside.crm.traits:set_membership
      - kickside.crm.traits:log_activity
      - kickside.crm.traits:delete_activity
      - kickside.crm.traits:link_reference
      - kickside.crm.traits:unlink_reference

  - name: list_records
    kind: function.lua
    meta:
      type: tool
      title: List CRM Records
      llm_alias: CRMListRecords
      llm_description: "Page and search compact record summaries (id, type, dates and name/title/status/owner values). Pass fields to select other record values; CRMGetRecord returns all values and associations. Continue with offset + limit until total is reached."
      mcp: { required_scopes: [state.read] }
      input_schema: |
        {
          "type": "object",
          "properties": {
            "crm_id": { "type": "string" },
            "object_type": { "type": "string" },
            "filters": {
              "type": "array",
              "items": {
                "type": "object",
                "properties": {
                  "attr": { "type": "string" },
                  "op": { "type": "string", "enum": ["eq", "neq", "lt", "lte", "gt", "gte", "contains", "in_list", "is_null"] },
                  "value": {}
                },
                "required": ["attr", "op"],
                "additionalProperties": false
              }
            },
            "sort": {
              "type": "object",
              "properties": {
                "attr": { "type": "string" },
                "dir": { "type": "string", "enum": ["asc", "desc"] }
              },
              "required": ["attr", "dir"],
              "additionalProperties": false
            },
            "search": { "type": "string" },
            "fields": { "type": "array", "items": { "type": "string" }, "description": "Record value names to return instead of name/title/status/owner." },
            "limit": { "type": "integer", "minimum": 1 },
            "offset": { "type": "integer", "minimum": 0 }
          },
          "required": ["object_type"],
          "additionalProperties": false
        }
      output_schema: |
        {
          "oneOf": [
            {
              "type": "object",
              "properties": {
                "success": {
                  "type": "boolean",
                  "const": true
                },
                "rows": {
                  "type": "array",
                  "items": {
                    "type": "object",
                    "properties": {
                      "record_id": {
                        "type": "string"
                      },
                      "object_type": {
                        "type": "string"
                      },
                      "values": {
                        "description": "Summary values, or the values named by fields. Full associations are available from CRMGetRecord.",
                        "type": "object"
                      }
                    },
                    "required": [
                      "record_id"
                    ]
                  }
                },
                "total": {
                  "type": "integer",
                  "minimum": 0
                },
                "limit": {
                  "type": "integer",
                  "minimum": 1
                },
                "offset": {
                  "type": "integer",
                  "minimum": 0
                }
              },
              "required": [
                "success",
                "rows",
                "total",
                "limit",
                "offset"
              ],
              "additionalProperties": false
            },
            {
              "type": "object",
              "properties": {
                "success": {
                  "type": "boolean",
                  "const": false
                },
                "error": {
                  "type": "string"
                }
              },
              "required": [
                "success",
                "error"
              ],
              "additionalProperties": false
            }
          ]
        }
    source: file://crm_tool.lua
    method: list_records
    modules: [ctx, security, uuid]
    imports: *crm_tool_imports

  - name: get_record
    kind: function.lua
    meta:
      type: tool
      title: Get CRM Record
      llm_alias: CRMGetRecord
      llm_description: Read one CRM record by stable record id.
      mcp: { required_scopes: [state.read] }
      input_schema: |
        { "type": "object", "properties": { "crm_id": { "type": "string" }, "record_id": { "type": "string" } }, "required": ["record_id"], "additionalProperties": false }
      output_schema: |
        {
          "oneOf": [
            {
              "type": "object",
              "properties": {
                "success": {
                  "type": "boolean",
                  "const": true
                },
                "record": {
                  "type": "object",
                  "properties": {
                    "record_id": {
                      "type": "string"
                    },
                    "object_type": {
                      "type": "string"
                    },
                    "values": {
                      "type": "object"
                    }
                  },
                  "required": [
                    "record_id"
                  ]
                }
              },
              "required": [
                "success",
                "record"
              ],
              "additionalProperties": false
            },
            {
              "type": "object",
              "properties": {
                "success": {
                  "type": "boolean",
                  "const": false
                },
                "error": {
                  "type": "string"
                }
              },
              "required": [
                "success",
                "error"
              ],
              "additionalProperties": false
            }
          ]
        }
    source: file://crm_tool.lua
    method: get_record
    modules: [ctx, security, uuid]
    imports: *crm_tool_imports

