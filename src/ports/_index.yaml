version: "1.0"
namespace: kickside.crm.ports

entries:
  - name: membership_set
    kind: registry.entry
    meta: { type: kickside.automation.port, title: CRM collection membership set, icon: tabler:layout-kanban }
    binding: kickside.crm.binding:crm
    event: kickside.crm.events:membership.set
    config_schema: &crm_source
      thread_id:
        type: string
        picker: wc-component-picker
        class: crm
        required: true
        role: primary
        title: CRM

  - name: record_created
    kind: registry.entry
    meta: { type: kickside.automation.port, title: CRM record created, icon: tabler:database-plus }
    binding: kickside.crm.binding:crm
    event: kickside.crm.events:record.created
    config_schema: *crm_source

  - name: record_updated
